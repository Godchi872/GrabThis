<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680"><rect width="1280" height="680" rx="16" fill="#f5f7fa"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#20313e}.label{font-size:19px}.small{font-size:16px;fill:#526571}.item{font-size:20px}.number{font-size:18px;font-weight:700;fill:white}</style><text x="40" y="44" font-size="24" font-weight="700">Open the extensions page from the browser menu</text><text x="40" y="75" class="small">Chrome menu · illustrated guide · labels may vary in other browsers</text><rect x="30" y="104" width="1220" height="540" rx="12" fill="white" stroke="#cfd8df"/><path d="M30 168H1250" stroke="#cfd8df"/><rect x="100" y="117" width="1015" height="38" rx="19" fill="#edf1f5"/><text x="130" y="143" class="small">grabthis.vercel.app</text><text x="58" y="145" font-size="25">←</text><rect x="1187" y="113" width="48" height="48" rx="8" fill="#fff" stroke="#e34c26" stroke-width="3"/><g fill="#20313e"><circle cx="1211" cy="126" r="2.6"/><circle cx="1211" cy="137" r="2.6"/><circle cx="1211" cy="148" r="2.6"/></g><circle cx="1178" cy="115" r="17" fill="#e34c26"/><text x="1173" y="121" class="number">1</text><rect x="780" y="178" width="454" height="399" rx="12" fill="#fff" stroke="#cfd8df"/><text x="808" y="221" class="item">New tab</text><text x="808" y="267" class="item">New window</text><path d="M796 290H1218" stroke="#e1e6ea"/><text x="808" y="330" class="item">History</text><text x="808" y="377" class="item">Downloads</text><text x="808" y="424" class="item">Bookmarks and lists</text><rect x="794" y="444" width="426" height="52" rx="8" fill="#edf5f3" stroke="#e34c26" stroke-width="3"/><text x="819" y="478" class="item" font-weight="650">Extensions</text><text x="1187" y="478" class="item">›</text><circle cx="781" cy="451" r="17" fill="#e34c26"/><text x="776" y="457" class="number">2</text><text x="808" y="540" class="item">Settings</text><rect x="340" y="444" width="418" height="111" rx="10" fill="#